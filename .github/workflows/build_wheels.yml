name: Build and publish wheels

on:
  push:
    tags:
      - "v*"          # run on version tags: v0.1.0, v1.0.0, etc.
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  # ── Build wheels for every OS ───────────────────────────────────────────────
  build_wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4


      - name: Build wheels
        uses: pypa/cibuildwheel@v2.19.0
        env:
          # Build for Python 3.10, 3.11, 3.12, 3.13 — skip 32-bit and musl
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP:  "*-win32 *-manylinux_i686 *-musllinux*"

          # BLAS is loaded at runtime, so nothing is linked or bundled: one
          # wheel works with MKL, OpenBLAS, or neither
          CIBW_ENVIRONMENT: >
            PROMETHEUS_USE_OPENMP=1

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # ── Publish to PyPI on release tag ──────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: [build_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: List wheels
        run: ls dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
