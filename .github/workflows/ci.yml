name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # a newer push to the same branch cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── C++ library and the ctest suite, on all three platforms ────────────────
  cpp:
    name: C++ tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # Default generator on each platform: Make on Linux/macOS, MSVC on
      # Windows. No extra toolchain action needed.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # ctest runs each binary with WORKING_DIRECTORY set to the source tree,
      # which several tests need to find their fixtures (tests/test.csv etc).
      - name: Run tests
        run: bash .github/annotate.sh ctest --test-dir build --build-config Release --output-on-failure

  # ── gradcheck called out separately so a gradient regression is obvious ────
  gradients:
    name: Gradient check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target test_gradcheck

      - name: Verify every backward pass against finite differences
        run: bash .github/annotate.sh ctest --test-dir build --output-on-failure -R test_gradcheck

  # ── Python extension, numpy reference comparison, and the API checks ──────
  python:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip pybind11 numpy setuptools wheel safetensors

      # Install rather than build in place: setup.py build_ext --inplace put the
      # .so where the test scripts could not import it, so every Python test
      # failed with ModuleNotFoundError. Installing puts it on sys.path
      # regardless of the working directory.
      - name: Install the package
        run: python -m pip install . --no-build-isolation -v

      - name: Confirm the module imports
        run: python -c "import prometheus; print(prometheus.__file__)"

      # Recomputes every layer, op and loss in numpy and compares. This is the
      # only check that can catch a wrong forward pass, since gradcheck only
      # proves the backward agrees with whatever the forward does.
      - name: Forward-pass reference comparison against numpy
        run: bash .github/annotate.sh python tests/test_forward_reference.py

      - name: Python API and binding checks
        run: bash .github/annotate.sh python tests/test_python_api.py

      # Every name the README shows a reader must exist in the module. A
      # commit that renames or removes an op fails here until the docs say so.
      # Gradients of gradients, checked against finite differences, and the
      # MAML meta-gradient against finite differences of the meta-loss.
      - name: Higher-order gradients
        run: bash .github/annotate.sh python tests/test_higher_order.py

      # Every parallelised layer at full size, multi- vs single-threaded:
      # catches a data race that the small-shape tests never reach.
      - name: Parallel paths agree with single-threaded
        run: bash .github/annotate.sh python tests/test_parallel_consistency.py

      # Model files round-trip every dtype, and interoperate with the
      # official safetensors package in both directions.
      - name: Model files (safetensors)
        run: bash .github/annotate.sh python tests/test_safetensors.py

      # Promotion, integer/bool ops, float64 gradients, half precision, autocast.
      - name: Dtypes
        run: bash .github/annotate.sh python tests/test_dtypes.py

      - name: README matches the API
        run: bash .github/annotate.sh python tests/check_readme_api.py

      # Every Prometheus Model: shapes, parameter bookkeeping, and that
      # gradients actually reach every parameter.
      - name: Prometheus Models
        run: bash .github/annotate.sh python tests/test_models.py

      # The dashboard: panel structure, that the numbers match the model, and
      # that the HTML reaches for nothing external so it works offline.
      - name: Model dashboard
        run: bash .github/annotate.sh python tests/test_visualiser.py

  # ── ASAN + UBSAN: catches uninitialised reads, overflows, bad frees ───────
  sanitizers:
    name: Address and UB sanitizers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build instrumented
        run: |
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-san

      - name: Run the suite under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: bash .github/annotate.sh ctest --test-dir build-san --output-on-failure

  # ── Every matmul backend compared against naive reference loops ───────────
  # The BLAS calls pass explicit leading dimensions and transpose flags; a
  # mistake there is correct for square matrices and silently wrong for
  # rectangular ones. Nothing exercised these paths before.
  backends:
    name: matmul backend (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [tiled, openmp, openblas]

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenBLAS
        if: matrix.backend == 'openblas'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Configure
        run: |
          case "${{ matrix.backend }}" in
            tiled)    FLAGS="" ;;
            openmp)   FLAGS="-DUSE_OPENMP=ON" ;;
            openblas) FLAGS="-DUSE_OPENMP=ON" ;;
          esac
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $FLAGS

      - name: Build
        run: cmake --build build

      # the whole suite, not just the backend test: a wrong gemm corrupts
      # every layer that multiplies matrices
      # BLAS is loaded at runtime. Naming it explicitly makes a failure to
      # load it an error instead of a quiet fallback to the tiled kernel.
      - name: Run tests
        run: |
          if [ "${{ matrix.backend }}" = openblas ]; then export PROMETHEUS_BLAS=openblas; else export PROMETHEUS_BLAS=tiled; fi
          bash .github/annotate.sh ctest --test-dir build --output-on-failure

  # ── Examples, so they cannot rot silently ────────────────────────────────
  examples:
    name: Examples and ONNX export
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip pybind11 numpy setuptools wheel onnx
          python -m pip install . --no-build-isolation

      - name: Run the self-contained examples
        run: |
          for f in xor_example regression binary_classifier sentiment_rnn mnist_linear demo; do
            echo "--- $f ---"
            python "examples/$f.py" > /dev/null
          done

      - name: Export to ONNX and validate with the onnx checker
        run: |
          python - <<'PY'
          import onnx, prometheus as p
          from prometheus_onnx import save_onnx
          m = p.Sequential([p.Linear(2, 8), p.ReLU(), p.Linear(8, 1), p.Sigmoid()])
          save_onnx(m.layers, input_shape=[1, 2], path="ci.onnx")
          onnx.checker.check_model(onnx.load("ci.onnx"))
          print("onnx model is valid")
          PY
